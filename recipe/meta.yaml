{% set name = "pyshp" %}
{% set version = "3.1.8" %}
{% set deselect_tests = " --deselect=test_shapefile.py::test_reader_url" %}

# Passed locally but failed randomly on the build platform:
# E   shapefile.ShapefileException: Shapefile Reader requires a shapefile or file-like object. (no dbf file found)
package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: ec144fdbe5bae1b99c2ef741dc68228acf7c23a67338046ad3c6fc2c8b340e65

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  skip: true  # [py<39]

requirements:
  host:
    - pip
    - python
    - hatchling
  run:
    - python

test:
  source_files:
    - tests
  imports:
    - shapefile
  commands:
    - pip check
    - python -m pytest -v tests/test_shapefile.py {{ deselect_tests }}
  requires:
    - pip
    - pytest

about:
  home: https://pypi.org/project/pyshp
  license: MIT
  license_family: MIT
  license_file: LICENSE.TXT
  summary: Pure Python read/write support for ESRI Shapefile format
  description: |
    The Python Shapefile Library (PyShp) reads and writes ESRI Shapefiles in pure Python.
  dev_url: https://github.com/GeospatialPython/pyshp
  doc_url: https://github.com/GeospatialPython/pyshp

extra:
  recipe-maintainers:
    - pelson
    - ocefpaf
